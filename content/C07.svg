<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f5f2e9"/><circle cx="930" cy="1080" r="325" fill="#5c7591" opacity=".12"/><circle cx="930" cy="1080" r="235" fill="none" stroke="#5c7591" stroke-width="2" opacity=".35"/><path d="M82 143h65m-32-32v64" stroke="#5c7591" stroke-width="7"/><text x="172" y="156" font-family="Arial,sans-serif" font-size="29" fill="#5c7591" letter-spacing="5">SEEN &amp; UNDERSTOOD</text><text x="84" y="300" font-family="Arial,sans-serif" font-size="24" fill="#5c7591" letter-spacing="4">FRIENDSHIP</text><text x="84" y="440" font-family="Georgia,serif" font-size="79" fill="#203d32"><tspan x="84" dy="0">“We should catch up”</tspan><tspan x="84" dy="94">deserves a date.</tspan></text><text x="84" y="770" font-family="Arial,sans-serif" font-size="31" fill="#536158"><tspan x="84" dy="0">Try a ten-minute voice note instead of the</tspan><tspan x="84" dy="44">perfect plan.</tspan></text><path d="M84 1170h912" stroke="#c9cfc3"/><text x="84" y="1233" font-family="Arial,sans-serif" font-size="23" fill="#536158">A little more understood. A little less alone.</text><text x="930" y="1233" font-family="Arial,sans-serif" font-size="23" fill="#5c7591">C07</text></svg>